name: Littlespark
description: A magical kids learning app — Learn, Play, Grow!
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  just_audio: ^0.10.5
  audio_session: ^0.2.3
  flutter_tts: ^4.0.2
  lottie: ^3.0.0
  confetti: ^0.7.0
  flutter_animate: ^4.5.0
  animate_do: ^3.3.4
  google_fonts: ^6.2.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  speech_to_text: ^7.4.0
  permission_handler: ^12.0.3
  equatable: ^2.0.5
  cupertino_icons: ^1.0.6
  youtube_player_flutter: ^10.0.1
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_analytics: ^12.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  fonts:
    - family: FredokaOne
      fonts:
        - asset: assets/fonts/FredokaOne-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
  assets:
    - assets/lottie/
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
